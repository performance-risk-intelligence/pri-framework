<svg xmlns="http://www.w3.org/2000/svg" id="architecture-map" viewBox="0 0 1080 840" role="group" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">PRI architecture: CI/CD, evidence, gate, approval and conditional business impact</title>
<desc id="architecture-desc">Dashed arrows identify proposed CI/CD connections. Solid arrows identify relationships executed inside the simulation. Regression or insufficient evidence holds the candidate. Eligible evidence proceeds to a fictional human review and artifact-bound approval. Paired workload outcomes and separate economic assumptions feed the business model. Fictional incident history is isolated and affects neither gate nor finances. No production CI/CD system is connected.</desc>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#62675e"/></marker></defs>
<style>#architecture-map text{font-family:Arial,Helvetica,sans-serif;fill:#202720}#architecture-map .arch-node{cursor:pointer}#architecture-map .arch-node:focus{outline:none}#architecture-map .arch-node:focus rect,#architecture-map .arch-node[aria-pressed="true"] rect{stroke:#985337;stroke-width:3}#architecture-map .arch-title{font-size:16px}#architecture-map .arch-status{font-size:8px;letter-spacing:.7px}#architecture-map .arch-body{font-size:10px}#architecture-map .arch-edge{stroke:#62675e;stroke-width:1.5;fill:none;marker-end:url(#arch-arrow)}#architecture-map .arch-label{font-size:9px;fill:#62675e}</style>
<rect width="1080" height="840" fill="#f5f3ed"/>
